# Manual only: nothing is deployed unless a maintainer runs this workflow from the Actions tab.
name: Deploy web app to GitHub Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r webapp/requirements-build.txt
      # Same timestamp as the release build, so the wheel offered on the site is byte-identical to the released wheel.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Every Pyodide file is checked against data/raw/software_s2/ACQUISITION_LEDGER_S2.csv (SHA-256).
      - run: python webapp/build.py --fetch-runtime
      - name: Check every built file against webapp/dist/manifest.json
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          d = pathlib.Path("webapp/dist"); m = json.loads((d / "manifest.json").read_text())
          bad = [k for k, v in m["files"].items() if hashlib.sha256((d / k).read_bytes()).hexdigest() != v["sha256"]]
          assert not bad, bad
          print(len(m["files"]), "files OK; engine", m["engine_sha256"], "commit", m["source_commit"])
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: webapp/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
